services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: eiq
      POSTGRES_PASSWORD: eiq
      POSTGRES_DB: enterpriseiq
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eiq -d enterpriseiq"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://eiq:eiq@db:5432/enterpriseiq
      UPLOAD_DIR: /app/uploads
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_started

volumes:
  pgdata:
